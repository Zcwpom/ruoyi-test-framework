[pytest]
# 用例搜索路径
#   testcase —— 接口用例，需要若依后端在跑
#   tests    —— 单元测试，不依赖后端（CI 里跑的就是这个）
testpaths = testcase tests

# 用例文件/类/函数的命名规则（不匹配的不会被收集）
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 让 api / common / config 这些包可以被直接 import（pytest 7+ 支持）
pythonpath = .

# 默认参数
addopts =
    -vs
    --alluredir=./report/allure-results
    --clean-alluredir
    --strict-markers

# 自定义标记（配合 --strict-markers，未注册的 marker 会报错）
markers =
    smoke: 冒烟测试
    p0: 核心用例
    p1: 重要用例
    p2: 一般用例
